name: slack-notification

on:
  issues:
    types: [labeled]
jobs:
  slack-notifications:
    if: ${{ github.event.label.name == 'rejected' }}
    runs-on: self-hosted
    name: Sends a message to testing team
    steps:
      - name: Send message to Slack API
        uses: archive/github-actions-slack@v2.0.0
        id: notify
        with:
          slack-bot-user-oauth-access-token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          slack-channel: C06J03QR5TN
          slack-text: ${{ github.server_url }}/${{ github.repository }}/issues/${{ github.event.issue.number }}  \n A issue has been ${{ github.event.label.name}}, "${{ github.event.issue.title }}" in ${{ github.repository }} \n and was `${{ github.event.label.name}}` by "${{ github.event.issue.user.login }}".
